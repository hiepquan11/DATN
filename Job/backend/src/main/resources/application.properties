spring.application.name=backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

cloudinary.cloud_name=${CLOUDINARY_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_ADDRESS}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# VNPay Configuration
vnpay.pay-url=${VNPAY_URL}
vnpay.return-url=${VNPAY_URL_RETURN}
vnpay.tmn-code=${TMN_CODE}
vnpay.secret-key=${SECRET_KEY}
vnpay.api-url=${API_URL}
vnpay.version=${VERSION}
vnpay.command=${COMMAND}
vnpay.order-type=${ORDER_TYPE}